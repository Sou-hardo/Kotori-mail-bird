<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#147d63" />
    <title>Kotori is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f8f5;
        color: #18211c;
        font:
          16px system-ui,
          sans-serif;
      }
      main {
        max-width: 420px;
        padding: 32px;
        text-align: center;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        margin: auto;
        border-radius: 18px;
        background: #147d63;
        color: #fff;
        font-size: 28px;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      p {
        color: #69766e;
        line-height: 1.6;
      }
      button {
        border: 0;
        border-radius: 10px;
        background: #147d63;
        color: #fff;
        padding: 12px 18px;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">⌁</div>
      <h1>You’re offline</h1>
      <p>
        Reconnect to securely load your mail. Kotori does not store inbox or
        thread content in its offline cache.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
