services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kotori
      POSTGRES_USER: kotori
      POSTGRES_PASSWORD: kotori
    ports:
      - "5432:5432"
    volumes:
      - kotori-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotori -d kotori"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - kotori-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kotori-postgres:
  kotori-redis:
